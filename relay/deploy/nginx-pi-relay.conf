# Pi Agent relay — nginx server block for pi.hxlin.fun
#
# Paste inside the http {} block (or include from sites-enabled). Replace the
# server_name and certificate paths to match the domain you issue with certbot.
#
#   sudo certbot --nginx -d pi.hxlin.fun
#
# The H5 static build is served directly by nginx; only /api and /ws reach the
# Go relay, which listens on localhost only.

server {
    listen 80;
    listen [::]:80;
    server_name pi.hxlin.fun;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pi.hxlin.fun;

    ssl_certificate     /etc/letsencrypt/live/pi.hxlin.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pi.hxlin.fun/privkey.pem;

    # H5 build output (web/dist). nginx serves it with no extra process.
    root /var/www/pi-h5;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Long-lived WebSocket: desktop bridge and H5 clients.
    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
